<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No HTML sinks and no inline scripts in this app, so script-src 'self' costs
      nothing. style-src needs 'unsafe-inline' because React renders inline style
      props as style="..." attributes throughout the UI. connect-src is scoped to
      *.supabase.co (http+ws) rather than a hardcoded project ref so it survives a
      project change. frame-ancestors/report-uri are omitted: both are ignored on
      a meta-tag CSP (GitHub Pages can't set response headers to deliver them).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>CND Austria — Volunteer Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
